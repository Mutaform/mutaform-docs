# Реестр аддонов, из которых собирается справочник.
#
# `source` — путь к папке Python-пакета аддона (той, где лежит
# blender_manifest.toml), относительно `source_root`.
#
# Путь записан так, как устроен сам репозиторий аддона: CI клонирует каждый
# репозиторий в `sources/<имя>`, и `source` отсчитывается от него. На студийном
# диске репозиторий лежит на уровень глубже — в подпапке `Git/` своего проекта;
# генератор пробует и такое написание, менять реестр под локальную раскладку
# не нужно.
#
# `source_root` задаётся при запуске генератора:
#   python tools/gen_pages.py --source-root "D:/Mutaform/Mutaform Addons"
#
# В CI исходники подтягиваются из публичных репозиториев (см. clone_url),
# поэтому докам не нужен доступ к локальному диску.

source_root_default: ".."

addons:
  - slug: qc-bake
    source: "qc_bake/qc_bake"
    clone_url: "https://github.com/Mutaform/qc-bake"
    order: 1

  - slug: qc-validator
    source: "qc_validator/scene_qc_validator"
    clone_url: "https://github.com/Mutaform/scene-qc-validator"
    order: 2
    # Проверки описаны таблицей данных, а не панелями: без этого блока
    # справочник потерял бы главное содержимое аддона.
    registries:
      - key: checks
        module: "checks/__init__.py"
        variable: "CHECK_DEFINITIONS"

  - slug: qc-daily-render
    source: "qc_daily_render/qc_daily_render"
    clone_url: "https://github.com/Mutaform/qc-daily-render"
    order: 3

  - slug: qc-maya-viewport
    source: "qc_maya_viewport/maya_viewport_match"
    clone_url: "https://github.com/Mutaform/qc-maya-viewport"
    order: 4

  - slug: qc-bridge
    source: "qc_mutaform_bridge/mutaform_bridge"
    clone_url: "https://github.com/Mutaform/qc-bridge-blender-maya"
    order: 5

  # Первый аддон не для Blender. `kind: maya` отключает разбор кода: панель
  # там собирается императивным кодом Qt, достоверного списка элементов из
  # исходника не построить. Состав интерфейса описывается руками в content/,
  # из кода берётся только версия — она обязана совпадать с тем, что видит
  # художник. Имя и версия хоста живут здесь, потому что манифеста, откуда их
  # можно было бы прочитать, у аддона Maya нет.
  - slug: qc-bake-maya
    source: "qc_bake-maya/qc_bake_maya"
    clone_url: "https://github.com/Mutaform/qc-bake-maya"
    order: 6
    kind: maya
    id: qc_bake_maya
    name: "QC Bake for Maya"
    host: Maya
    host_version_min: "2025"
    website: "https://mutaform.github.io/qc-bake-maya/"

  # Сторонний аддон: автор — Кирилл Харичев, лицензия GPL-3.0-or-later.
  # Пакет лежит в КОРНЕ репозитория, а не во вложенной папке, поэтому в CI
  # `source` — это имя клона целиком. На студийном диске проект живёт под
  # `_Third-party/`, и путь до рабочего дерева пишется отдельно: угадывать его
  # перебором было бы нечестно.
  - slug: modular-environment-tools
    source: "Modular-environment-tools"
    source_local: "_Third-party/Modular-environment-tools/Git"
    # Форк студии: авторский `master` — версия 1.0.0, наша переработка живёт
    # в ветке `studio/rework`, её и описывает справочник.
    clone_url: "https://github.com/Mutaform/Modular-environment-tools"
    branch: studio/rework
    upstream_url: "https://github.com/HarichevK/Modular-environment-tools"
    order: 7
