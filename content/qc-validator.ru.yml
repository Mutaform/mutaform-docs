# Содержание справочника Scene QC Validator.
#
# Текст пишется руками под каждый элемент интерфейса; генератор собирает из
# него страницу и проверяет, что ничего не осталось неописанным. Подписи
# проверок и признак «есть ли автофикс» подтягиваются из кода — их придумывать
# нельзя, они должны совпадать с тем, что видно в панели.

title: Что делает каждая кнопка
intro: >-
  Здесь разобран каждый элемент панели QC Validator, ниже — таблица всех
  проверок, а в конце показано, как проверки выглядят на настоящей модели.

sections:
  - title: Верх панели
    intro: >-
      То, что видно всегда: область действия, кнопка запуска и полоса
      состояния над ними.
    controls: [scope, validate]

  - title: Results — разбор найденного
    intro: >-
      Список проблем после прогона. Пока Validate не нажимали, свиток пустой и
      сообщает об этом.
    controls: [filter, results-list, result-actions]

  - title: Checklist — что именно проверять
    intro: >-
      Набор проверок хранится в проекте и разложен по стадиям работы. Здесь же
      живут инструменты осмотра развёртки, но появляются они не всегда — см.
      ниже.
    controls:
      [project, stages, stage-tools, check-settings, tabs, select-all,
       check-list, check-params]

  - title: Инструменты осмотра развёртки
    intro: >-
      Три интерактивных инструмента: они ничего не пишут в результаты, а
      показывают состояние прямо в редакторе UV. Все три смотрят на один
      текстурный сет за раз — на грани активного материала — и перенаводятся
      следом, когда вы меняете активный слот.
    controls: [show-overlaps, show-padding, show-texel]

  - title: Review Scene — материалы и клетка
    intro: >-
      Свиток свёрнут по умолчанию. Внутри — разбор материалов по сцене и
      шахматная текстура для оценки развёртки.
    controls: [materials, checker-tiling, checker-buttons]

controls:
  scope:
    label: Scope
    shot: c/scope.png
    covers: [validation_scope]
    what: >-
      Какие объекты попадут в проверку.
    default: Selection — только выделенные меши.
    when: >-
      Оставляйте Selection, пока работаете над одним ассетом: на тяжёлой сцене
      это заметно быстрее. Visible Scene и Entire Scene нужны перед сдачей,
      когда надо убедиться, что в файле не осталось забытого мусора. Разница
      между ними одна: Entire Scene смотрит и скрытые объекты тоже.

  validate:
    label: Validate
    shot: c/validate.png
    covers: [sqc.run_validate, sqc.init_checks]
    what: >-
      Прогоняет все включённые проверки и заполняет список результатов.
    when: >-
      После каждого заметного шага работы, а не один раз перед сдачей: чем
      раньше поймана проблема, тем дешевле её чинить.
    result: >-
      Полоса состояния над кнопкой становится зелёной («All checks passed») или
      красной с числом блокирующих проблем. Ниже, в свитке Results, появляется
      список.
    note: >-
      В новом файле чек-листа ещё нет, и вместо Validate панель показывает
      кнопку **Initialize Checklist**. Нажмите её один раз — проверки заведутся
      из активного проекта, и дальше кнопка больше не появится.

  filter:
    label: Фильтр списка и Fix All
    shot: c/filter.png
    covers: [result_filter, sqc.fix_all]
    what: >-
      Слева — чем ограничить список на экране, справа — кнопка «починить всё,
      что чинится».
    default: All Results — показываются все строки.
    when: >-
      Фильтр удобен на длинном списке: **Fixable Only** оставляет то, что
      закроется автоматически, и сразу видно, сколько работы останется руками.
      Фильтр влияет только на показ — вердикт от него не меняется.
    result: >-
      Fix All идёт по списку и чинит всё подряд, показывая прогресс. На тяжёлой
      сцене это не мгновенно.
    note: >-
      После Fix All обязательно запустите Validate заново. Часть исправлений
      меняет геометрию, и на изменённой модели могут вылезти новые замечания —
      например, триангуляция n-гонов способна породить вырожденные грани.

  results-list:
    label: Список проблем
    shot: c/results-list.png
    covers: [results, active_result_index, object_name, message, muted]
    what: >-
      Каждая строка — одна проблема на одном объекте: имя объекта, название
      проверки и значок уровня.
    when: >-
      Кликайте по строкам подряд. Клик не просто выделяет строку: аддон
      выделяет проблемный объект и переходит в режим редактирования с
      выделенными вершинами, рёбрами или полигонами — теми самыми, из-за
      которых проверка сработала.
    note: >-
      Красный значок — Fail, блокирует сдачу. Серый перечёркнутый глаз —
      заглушённая строка, она на вердикт не влияет. Уровень задаётся для каждой
      проверки отдельно в чек-листе.

  result-actions:
    label: Ignore / Select / Fix Me
    shot: c/result-actions.png
    covers: [sqc.toggle_result_mute, sqc.select_result, sqc.fix_result]
    what: >-
      Действия над выбранной строкой. Над ними — текстовое пояснение, что
      именно нашла проверка.
    when: >-
      **Select** возвращает выделение на проблемные элементы, если вы успели
      выделить что-то другое. **Fix Me** чинит только эту строку и появляется
      лишь у проверок, у которых автофикс есть. **Ignore** заглушает проблему.
    result: >-
      Заглушённая строка перестаёт влиять на вердикт и переживает повторный
      Validate: список заглушек хранится в сцене отдельно от результатов.
      Кнопка при этом меняется на Restore.
    note: >-
      Заглушка привязана к паре «объект + проверка». Переименуете объект — она
      отвяжется, и проблема вернётся в список.

  project:
    label: Строка Project
    shot: c/project.png
    covers: [sqc.load_project, sqc.save_project, sqc.import_project_file,
             sqc.export_project_file, sqc.delete_project, active_project_name,
             new_project_name, project_name]
    what: >-
      Выбор проекта и три кнопки справа: сохранить текущий набор как проект,
      загрузить проект из файла, выгрузить в файл.
    when: >-
      Проект — это набор стадий. Свой проект заводят, когда правила отличаются
      от студийных: другое именование, другие допуски. Чтобы передать набор
      другому художнику, выгружаете в JSON, он у себя загружает.
    note: >-
      Встроенный проект перезаписать нельзя — сохранение всегда создаёт
      пользовательскую копию в папке расширения. Так студийный набор не
      испортить случайно.

  stages:
    label: Кнопки стадий
    shot: c/stages.png
    covers: [sqc.load_stage, active_stage_name, applied_stage_key, stage_name]
    what: >-
      Ряд кнопок под строкой проекта. Каждая — сохранённый набор: какие
      проверки включены, с каким уровнем и какими параметрами.
    when: >-
      Переключайте по мере работы. Стадия — это не «уровень строгости», а
      набор под конкретный этап: на Blockout включено 14 проверок, на
      HighPoly — 9, на LP_UVs — 25. HighPoly нарочно самая свободная: на
      скульпте незамкнутая сетка, вырожденные грани и вогнутые полигоны в
      порядке вещей, и придираться к ним рано. Требовать чистую развёртку на
      блокауте так же бессмысленно, а перед текстурированием — обязательно.
    result: >-
      Нажатие сразу применяет стадию: галочки в чек-листе переставляются,
      параметры подставляются. Активная стадия остаётся вдавленной.
    note: >-
      Стадия LP_UVs — особая: только на ней в панели появляются три инструмента
      осмотра развёртки. На других стадиях их просто нет.

      Стадия переключает только те проверки, что в ней перечислены; остальные
      остаются как были. Во встроенном проекте перечислены все 27, поэтому
      переключение честно гасит лишнее и не тянет включённое с прошлой стадии.
      В своём проекте следите за этим сами: проверка, которую стадия не
      упоминает, останется в том состоянии, в каком её застали.

  stage-tools:
    label: Кнопки справа от стадий
    shot: c/stage-tools.png
    covers: [sqc.save_stage, sqc.delete_stage, new_stage_name]
    what: >-
      Мелкий ряд значков: записать текущее состояние чек-листа в стадию,
      сохранить весь проект копией, удалить стадию.
    when: >-
      Настроили чек-лист под конкретную задачу и хотите вернуться к нему
      завтра — сохраните стадию.
    note: >-
      Кнопка удаления есть только у пользовательских проектов: из встроенного
      стадию не убрать.

  check-settings:
    label: Check Settings
    shot: c/check-settings.png
    covers: [show_check_settings]
    what: >-
      Раскрывает сам чек-лист.
    default: свёрнуто
    when: >-
      Когда нужно включить или выключить отдельные проверки, поменять уровень
      или подкрутить параметр.
    note: >-
      Это первое, обо что спотыкаются новички: пока строка свёрнута, проверок в
      панели не видно вообще — только выбор проекта и стадии. Кажется, что
      чек-листа нет.

  tabs:
    label: Вкладки Mesh / Objects / Mapping / Material
    shot: c/tabs.png
    covers: [checklist_tab]
    what: >-
      Делят проверки по типу: геометрия, объекты и трансформации, развёртка,
      материалы.
    when: >-
      Просто чтобы не листать 26 строк подряд. Под вкладками написано, сколько
      проверок включено на текущей.
    note: >-
      Вкладка меняет только показ. Validate всегда прогоняет все включённые
      проверки, а не только те, что открыты сейчас.

  select-all:
    label: Select All / Deselect All
    shot: c/select-all.png
    covers: [sqc.select_all_checks, current_tab_only, enable]
    what: >-
      Включает или выключает разом все проверки текущей вкладки.
    when: >-
      Быстрый способ собрать свой набор: снять всё и отметить нужное, вместо
      того чтобы гасить два десятка галочек по одной.

  check-list:
    label: Список проверок
    shot: c/check-list.png
    covers: [checks, active_check_index, enabled, severity]
    what: >-
      Галочка включает проверку, выпадающий список справа задаёт её уровень.
    when: >-
      Уровень стоит менять чаще, чем выключать проверку. **Fail** блокирует
      сдачу, **Info** только сообщает. Если проверка в вашем пайплайне
      желательна, но не обязательна, переведите её в Info — так о ней хотя бы
      будет видно, а вердикт она не испортит.
    note: >-
      Изменения относятся к текущей сцене. Чтобы они пережили файл, сохраните
      стадию.

  check-params:
    label: Описание и параметры проверки
    shot: c/check-params.png
    covers: [float_param_1, float_param_2, int_param_1, string_param_1,
             bool_param_1, description, label, category, can_fix,
             fix_is_destructive, check_id, check_label]
    what: >-
      Коробка под списком: описание выбранной проверки и её настройки, если они
      у неё есть.
    when: >-
      Сюда лезут, когда проверка ругается на то, что в вашем проекте нормально.
      Например, Object Name Pattern задаётся регулярным выражением — под своё
      именование меняется здесь.
    note: >-
      У большинства проверок настроек нет, и коробка показывает только
      описание. Смысл параметров у каждой проверки свой — он указан в таблице
      ниже.

  show-overlaps:
    label: Show Overlaps
    shot: c/show-overlaps.png
    covers: [sqc.toggle_overlap_visual, overlap_visual_use_material_scope,
             overlap_visual_uv_set_number]
    what: >-
      Подсвечивает в редакторе UV острова, налезающие друг на друга.
    when: >-
      Когда проверка Overlapped UV сообщила о налезании, а найти его глазами не
      выходит. В списке результатов написано только «есть налезание» — а вот
      где именно, показывает этот инструмент.
    result_shot: g/uv-overlaps-pair.png
    note: >-
      Галочка слева важнее, чем кажется. Без неё смотрится только активный
      объект; с ней — все видимые меши с тем же материалом, то есть всё, что
      попадёт в один атлас. Два объекта по отдельности могут быть чистыми и
      налезать друг на друга в общей развёртке — без этой галочки такое не
      находится.

      Смотрится один текстурный сет за раз: в счёт идут только грани активного
      материала, чужие острова рядом не показываются и налезанием не считаются.
      Переключите активный слот материала — осмотр перенаведётся на него на
      лету, выходить и заходить заново не нужно.

      Исключение — осмотр, открытый кликом по строке результата: он охватывает
      меш целиком, чтобы показанное совпало с тем, на что пожаловалась
      проверка. Активный слот такой осмотр не отслеживает.

      Поле UV set справа — номер набора, считая с единицы.

  show-padding:
    label: Show Padding
    shot: c/show-padding.png
    covers: [sqc.toggle_padding_visual, padding_visual_use_material_scope,
             sqc.step_padding_value, padding_texture_input, padding_value_input,
             target, direction]
    what: >-
      Показывает, во что превратятся отступы между островами при заданном
      размере текстуры.
    when: >-
      До запекания, чтобы понять, не слипнутся ли соседние острова. Стрелками
      меняются два числа: слева размер текстуры, справа отступ в пикселях.
    result_shot: g/uv-padding-pair.png
    note: >-
      При смене размера текстуры отступ пересчитывается пропорционально —
      соотношение сохраняется, и не приходится пересчитывать в уме.

      Отступ меряется вокруг следа активного материала, а не вокруг меша: там,
      где его грани сходятся с гранями другого материала, проходит край
      острова. На мультиматериальной модели это и нужно — соседний материал
      уедет в свою текстуру и мешать не будет.

  show-texel:
    label: Show Texel Density
    shot: c/show-texel.png
    covers: [sqc.toggle_texel_density_visual,
             texel_density_visual_use_material_scope]
    what: >-
      Красит объекты по плотности текселей.
    when: >-
      Когда в сцене несколько ассетов и надо убедиться, что масштаб развёртки у
      них общий. Выбивающийся объект видно сразу по цвету — на текстуре это
      выглядело бы как разная чёткость деталей.
    note: >-
      Цвет читается относительно средней плотности, а средняя считается только
      по граням активного материала. Второй материал на той же модели эталон на
      себя не тянет, так что сравнивать имеет смысл в пределах одного
      текстурного сета. Ровный цвет по всей модели означает, что по этому сету
      расхождений нет.

  materials:
    label: Список материалов
    shot: c/materials.png
    covers: [sqc.select_material_objects, sqc.select_material_users,
             material_name]
    what: >-
      Все материалы в текущей области действия: сколько объектов и слотов
      использует каждый. У строки два действия — само имя материала и кнопка
      с иконкой развёртки справа.
    when: >-
      Перед запеканием — понять, что попадёт в один атлас, и обойти материалы
      по очереди.

      **Клик по имени** выделяет объекты с этим материалом по всей сцене — не
      только те, что попали в Scope, чтобы забытый в стороне дубль не
      потерялся. Заодно у каждого выделенного этот материал становится активным
      слотом, а значит инструменты осмотра развёртки уже наведены на него.

      **Кнопка справа** — Review Material UVs. Она заводит многообъектный режим
      редактирования, в котором выделены только грани этого материала: в
      редакторе UV видно его развёртку и ничего лишнего. Повторное нажатие
      осмотр заканчивает.
    result: >-
      Пока осмотр идёт, кнопка вдавлена, а под списком стоит строка
      «Reviewing <имя материала>». Такая же появляется в панели Checklist —
      чтобы было видно, на что наведены оверлеи, даже когда список материалов
      свёрнут.

      По окончании возвращаются выделение, режим и синхронизация UV, ровно те,
      что были до начала. Переход с материала на материал этот снимок не
      сбрасывает: чтобы вернуться к своей работе, осмотр достаточно выключить
      один раз.
    note: >-
      Список подчиняется выбранному Scope. С Selection он покажет материалы
      только выделенных объектов. Пока идёт осмотр, список нарочно продолжает
      показывать объекты, бывшие в области действия на его старте: иначе
      Selection схлопнулся бы на пользователей одного материала и перейти к
      следующему стало бы некуда.

      Скрытые и невыделяемые объекты пропускаются, их число аддон пишет в
      статусной строке. Материал, лежащий в слоте, но не назначенный ни одной
      грани, сообщит об этом отдельно и осмотр не начнёт.

  checker-tiling:
    label: Checker Tiling
    shot: c/checker-tiling.png
    covers: [uv_checker_tiling]
    what: >-
      Плотность шахматной текстуры.
    default: "0.25"
    when: >-
      Крутится на лету, пока текстура включена. Мелкая клетка — точнее видно
      растяжение, крупная — понятнее общий масштаб.

  checker-buttons:
    label: Square Checker / Line Checker
    shot: c/checker-buttons.png
    covers: [sqc.toggle_uv_checker, checker_type]
    what: >-
      Натягивают на все материалы проверочную текстуру: клетку или полосы.
    when: >-
      Клетка показывает растяжение и масштаб, полосы — направление развёртки и
      скосы. Повторное нажатие снимает текстуру.
    note: >-
      Исходные материалы не портятся: аддон запоминает их и возвращает при
      выключении. Но не сохраняйте файл с включённой проверочной текстурой —
      велик шанс забыть и отдать ассет в таком виде.

checks:
  title: Все проверки
  intro: >-
    Подписи и признак автофикса взяты прямо из аддона, поэтому таблица не может
    разойтись с тем, что вы видите в панели. «Меняет геометрию» означает, что
    фикс правит модель, а не просто помечает проблему.
  items:
    geo_has_soft_edges:
      what: >-
        Ловит меш, у которого жёсткими помечены вообще все рёбра. Обычно это
        след импорта или случайного Shade Flat на всю модель.
    geo_ngons:
      what: >-
        Полигоны больше чем из четырёх вершин. Фикс триангулирует их.
    geo_non_manifold:
      what: >-
        Некорректная топология: рёбра с тремя и более гранями, вывернутые
        вееры, дыры в объёме. Фикс режет вееры и заваривает вершины только
        внутри каждой отдельной детали, поэтому соседние детали не слипаются.
    geo_zero_area:
      what: "Вырожденные грани — площадь меньше допуска."
    geo_zero_length:
      what: "Рёбра короче допуска, обычно сдвоенные вершины."
    geo_non_planar:
      what: >-
        Четырёхугольники, вершины которых не лежат в одной плоскости. В движке
        такая грань разобьётся на треугольники непредсказуемо.
    geo_concave_faces:
      what: "Полигоны с вогнутым углом."
    geo_duplicate_faces:
      what: "Две грани на одном и том же наборе вершин."
    geo_loose:
      what: >-
        Вершины и рёбра, не входящие ни в одну грань. При экспорте теряются или
        дают мусор.
    geo_animation_keys:
      what: >-
        На объекте, меше или ключах формы осталась анимация — для статичного
        ассета это лишние данные в FBX.
    tr_unapplied:
      what: >-
        Положение, поворот или масштаб отличаются от исходных. Фикс применяет
        трансформацию, то есть меняет координаты вершин.
    tr_world_origin:
      what: "Начало координат объекта не в нуле мира."
    tr_pivot_center:
      what: >-
        Начало координат не в центре габаритов. Автофикса нет намеренно:
        правильное место пивота зависит от того, как ассет ставится в уровне.
    uv_missing:
      what: "У меша нет ни одного UV-набора."
    uv_set_count:
      what: "UV-наборов больше, чем разрешено параметром."
    uv_single_tile:
      what: >-
        Острова вылезли за первый квадрат 0-1. Для обычного ассета это ошибка,
        для UDIM-пайплайна проверку выключают.
    uv_set_names:
      what: >-
        Блендеровские `UVMap` заменяются на `map1`, `map2` — так их ожидает Maya
        и часть движков.
    uv_overlap:
      what: >-
        Налезающие друг на друга UV. Найденное разворачивается до целых
        островов, чтобы выделение было осмысленным.
    uv_padding:
      what: >-
        Не проверка, а интерактивный предпросмотр отступов. В результаты ничего
        не пишет и в списке чек-листа не показывается.
    uv_no_hard_edge_on_uv_borders:
      what: >-
        Каждое ребро на границе острова должно быть жёстким. Иначе по шву на
        запечённой нормали пойдёт градиент.
    uv_random_sharp:
      what: >-
        Обратная проверка: жёсткие рёбра без границы развёртки под ними. Такое
        ребро создаёт лишний шов в нормалях.
    uv_unaligned_edges:
      what: >-
        Границы островов, отклонившиеся от осей на доли градуса, у в остальном
        прямоугольных развёрток. На глаз незаметно, а текстура по такому краю
        получается рваной.
    nm_object_pattern:
      what: "Имя объекта должно совпадать с регулярным выражением."
    mat_missing:
      what: "У объекта или части его граней не назначен материал."
    mat_material_count:
      what: "Материалов на одном меше больше, чем разрешено."
    mat_material_name:
      what: "Имена материалов должны совпадать с шаблоном."
    obj_nanite_closed_geometry:
      what: >-
        Открытая оболочка должна быть утоплена в соседнюю геометрию. Ловит
        накладки, висящие в воздухе, и те, что дотянулись до поверхности не
        целиком: в Unreal на таком месте Nanite покажет дыру.

examples:
  title: Как это выглядит на модели
  intro: >-
    Слева — что подсвечивается, когда нажимаешь на строку результата. Справа —
    что осталось после Fix Me. Все кадры сняты настоящим прогоном валидатора на
    специально сломанной геометрии.
  items:
    - title: N-Gons
      shot: g/ngons.png
      what: >-
        Крышки цилиндра — полигоны из десяти вершин. Автофикс триангулирует их;
        боковые четырёхугольники не трогает.
    - title: Loose Geometry
      shot: g/loose.png
      what: >-
        Вершина и ребро, не входящие ни в одну грань. В сцене их не видно —
        пока не включишь каркас или не нажмёшь на строку результата.
    - title: Non-Manifold Geometry
      shot: g/non-manifold.png
      what: >-
        Три грани, сходящиеся на одном ребре. Подсвечено именно ребро — по нему
        сразу понятно, где деталь собрана неправильно.
    - title: Concave Faces
      shot: g/concave.png
      what: >-
        Полигон с вогнутым углом. Фикс разбивает его на выпуклые.
    - title: Non-Planar Faces
      shot: g/non-planar.png
      what: >-
        Четырёхугольник, у которого одна вершина поднята над плоскостью
        остальных. Фикс разбивает грань, чтобы движку нечего было додумывать.
    - title: Zero Area Faces
      shot: g/zero-area.png
      what: >-
        Грань нулевой площади: две её вершины лежат в одной точке. На модели
        такая грань не видна вовсе, а в экспорте даёт мусор.
    - title: Zero Length Edges
      shot: g/zero-length.png
      what: >-
        Ребро между двумя совпадающими вершинами. Фикс сваривает их.
    - title: Duplicate Faces
      shot: g/duplicate-faces.png
      what: >-
        Две грани на одном и том же наборе вершин. Внешне модель выглядит
        нормально, а при запекании такие грани дерутся за одни и те же тексели.
    - title: Too Much Hard Edge
      shot: g/hard-edges.png
      what: >-
        Сфера, у которой жёсткими помечены все рёбра до единого. Фикс снимает
        пометки, и сглаживание возвращается.
    - title: Pivot Not Centered
      shot: g/pivot-center.png
      what: >-
        Начало координат объекта стоит в стороне от геометрии. Автофикса нет
        намеренно: куда должен смотреть пивот, зависит от того, как ассет
        ставится в уровне, и угадывать за художника аддон не берётся.
    - title: Show Overlaps
      shot: g/uv-overlaps-pair.png
      what: >-
        Слева обычный вид развёртки: налезание есть, но глазом его не поймать.
        Справа включён Show Overlaps — пересечение залито цветом.
    - title: Show Padding
      shot: g/uv-padding-pair.png
      what: >-
        Справа помечены острова, у которых при заданном размере текстуры не
        хватает запаса до соседей. При запекании такие острова потекут друг в
        друга.
    - title: Nanite Closed Geometry
      shot: g/nanite.png
      what: >-
        Слева накладка утоплена в стену: её открытый край оказался внутри
        соседней геометрии, и претензий нет. Справа тот же элемент отодвинут —
        край повис в воздухе, и проверка подсветила граничные рёбра.

        Сообщение бывает двух видов. «Sealed by nothing» — оболочку не
        закрывает ничто, как на правом кадре. «Not fully embedded» — край
        дотянулся не весь, и рядом указан самый большой зазор в миллиметрах;
        так бывает у наклонённой накладки, у которой один угол вышел наружу.

        Автофикса нет: подвинуть или дотянуть геометрию может только человек.
