# Содержание справочника QC Bake.
#
# Это НЕ файл перевода — это сам текст документации. Справочник больше не
# пересказывает код: генератор из него только собирает страницу и проверяет,
# что ни один элемент интерфейса не остался неописанным.
#
# Поля каждого элемента:
#   label     подпись, как она написана в аддоне
#   shot      снимок именно этого элемента
#   what      что делает — обычными словами, без терминов из кода
#   when      когда его трогать; здесь же сценарий использования
#   result    что произойдёт после нажатия / смены значения
#   default   значение по умолчанию словами
#   disabled  когда элемент серый и почему
#   note      предупреждение, если на этом легко обжечься
#   covers    что этот раздел закрывает: имена операторов и настроек.
#             По нему проверяется, что в аддоне не осталось неописанного.
#
# Обязательны только label, shot и what.

title: Что делает каждая кнопка
intro: >-
  Здесь разобран каждый элемент панели QC Bake: как он выглядит, что делает и
  когда пригодится. Порядок разделов совпадает с порядком свитков в самой
  панели.

sections:
  - title: Главные кнопки
    intro: >-
      Всегда на виду, свитков не требуют. Обе работают с выделенными объектами.
    controls: [create-namepair, swap]

  - title: Visibility — показать и скрыть
    intro: >-
      Свиток скрывает и показывает объекты по их роли — по всей сцене сразу,
      независимо от того, что выделено. Строк четыре: High, Low, Cage и All;
      устроены они одинаково, поэтому разобрана одна.
    controls: [vis-row, vis-all]

  - title: Utilities — работа со сценой целиком
    intro: >-
      Здесь две независимые вещи: укрупнение групп запекания и раскладка по
      коллекциям. Обе берут объекты по суффиксам в именах, поэтому пропы и
      вспомогательная геометрия не затрагиваются.
    controls: [group-prefix, reduce, layout-flat, layout-per-asset]

  - title: Naming — какими суффиксами помечать
    intro: >-
      Определяет, как аддон называет роли и по какому признаку отличает
      высокополигональный объект от низкополигонального.
    controls: [convention, custom-suffixes, detect-by]

  - title: Options — поведение при переименовании
    intro: >-
      Шесть галочек, влияющих на то, что именно произойдёт при нажатии
      Create Namepair.
    controls:
      [opt-random, opt-datablock, opt-cage, opt-collection, opt-hide, opt-collisions]

controls:
  create-namepair:
    label: Create Namepair
    shot: c/create-namepair.png
    covers: [qcbake.create_namepair]
    what: >-
      Переименовывает выделенные объекты так, чтобы запекатель понял, где у вас
      высокополигональная модель, а где низкополигональная.
    when: >-
      Как только рядом лежат скульпт и готовая под него низкополигональная
      модель. Выделите оба объекта — порядок не важен — и нажмите.

      Если объектов больше двух, выделите сначала все скульпты, а низкополигональную
      модель — последней: последний выделенный объект (он обведён светлым)
      аддон и считает низкополигональным.
    result: >-
      Объекты получают имена вида `barrel_low` и `barrel_high`. За основу берётся
      имя низкополигонального объекта, старый суффикс из него вырезается. Когда
      скульптов несколько, они нумеруются: `barrel_high_01`, `barrel_high_02`.
      В статусной строке внизу окна аддон пишет, что получилось.
    result_shot: r/create-namepair.png
    disabled: >-
      Выделено меньше двух объектов. Считаются только меши: кривые, пустышки и
      лампы в счёт не идут.
    note: >-
      Аддон сравнивает объекты по количеству треугольников уже с учётом
      модификаторов. Если на низкополигональной модели висит Subdivision Surface,
      она может оказаться тяжелее скульпта, и роли определятся наоборот. Это
      лечится соседней кнопкой.

  swap:
    label: Swap High / Low
    shot: c/swap.png
    covers: [qcbake.swap]
    what: >-
      Меняет местами роли двух объектов: тот, что назывался `_low`, становится
      `_high`, и наоборот.
    when: >-
      Сразу после Create Namepair, если видно, что аддон угадал наоборот.
      Быстрее, чем переименовывать руками: имена в паре обычно совпадают, и
      вручную придётся переименовывать через временное имя.
    result: >-
      Оба объекта меняются именами. Mesh-данные переименовываются вместе с ними,
      если включена галочка Also Rename Mesh Data.
    disabled: >-
      Выделено не ровно два объекта, либо среди них нет одного с суффиксом low и
      одного с суффиксом high.

  vis-row:
    label: Строка группы (High, Low, Cage)
    shot: c/vis-row.png
    covers: [qcbake.toggle_visibility]
    what: >-
      Показывает или скрывает во всей сцене объекты этой роли. Строки Low и Cage
      работают точно так же.
    when: >-
      Когда скульпты мешают смотреть на низкополигональную модель — или наоборот.
      Особенно удобно, когда пар в сцене много: выделять ничего не нужно, аддон
      сам находит объекты по суффиксу.
    result: >-
      Объекты прячутся или показываются во вьюпорте. Кнопка, соответствующая
      текущему состоянию группы, вдавлена и с иконкой глаза.
    note: >-
      Состояние читается так: вдавлена и с глазом — вся группа в этом состоянии;
      не вдавлена ни одна — часть объектов скрыта, часть нет; вся строка серая —
      объектов с таким суффиксом в сцене вообще нет.

  vis-all:
    label: Строка All
    shot: c/vis-all.png
    covers: [qcbake.toggle_visibility]
    what: >-
      То же самое, но сразу для всех ролей — и high, и low, и cage.
    when: >-
      Чтобы одним движением убрать с глаз всё, что относится к запеканию, и
      посмотреть на остальную сцену. И чтобы так же быстро вернуть.

  group-prefix:
    label: Prefix и Minimum Gap
    shot: c/group-prefix.png
    covers: [reduce_group_prefix, reduce_min_gap]
    what: >-
      Два поля, настраивающие соседнюю кнопку Reduce Bake Groups. **Prefix** —
      основа имени для укрупнённых групп, к ней добавляется номер.
      **Minimum Gap** — насколько далеко друг от друга должны стоять ассеты,
      чтобы им разрешили делить один проход запекания.
    default: >-
      Prefix — `BakeGroup`, Minimum Gap — 5 сантиметров (значение рассчитано на
      сцену в метрах).
    when: >-
      Minimum Gap стоит поднять, если после укрупнения на запечённых картах
      полезли следы соседних ассетов. Чем больше значение, тем осторожнее аддон
      объединяет и тем больше групп останется.
    note: >-
      Пробелы в Prefix заменяются подчёркиваниями. Пустое поле вернётся к
      `BakeGroup`.

  reduce:
    label: Reduce Bake Groups
    shot: c/reduce.png
    covers: [qcbake.reduce_groups, qcbake.restore_reduce_groups]
    what: >-
      Объединяет несколько отдельных пар в общие группы запекания, давая им
      общее имя.
    when: >-
      Когда в сцене десяток мелких ассетов и печь каждый отдельным проходом
      расточительно. Разнесённые в пространстве объекты не проецируются друг в
      друга, значит их можно печь вместе.

      Типовой порядок: расставить ассеты по сцене подальше друг от друга →
      сделать каждому пару → нажать Reduce → разложить по коллекциям.
    result: >-
      Объекты объединённой группы получают имена `BakeGroup_01_low`,
      `BakeGroup_01_high_01` и так далее. Сколько ассетов слилось и сколько
      неполных пар пропущено, аддон пишет в статусной строке.

      Если безопасного объединения не нашлось, ничего не переименовывается —
      значит, ассеты стоят слишком близко.
    result_shot: r/reduce-scale.png
    note: >-
      Кнопка со стрелкой справа — откат к именам, которые были до последнего
      запуска. Старые имена аддон хранит прямо на объектах, поэтому откат
      переживает сохранение и перезагрузку файла и не зависит от истории отмен
      Blender.

      Откатить можно только **последний** прогон. Запустите Reduce дважды — и
      первый набор имён потерян навсегда. Стрелка серая, когда откатывать
      нечего.

  layout-flat:
    label: "Flat ( High / Low )"
    shot: c/layout-flat.png
    covers: [qcbake.organize]
    what: >-
      Раскладывает все объекты запекания по коллекциям, сгруппировав их по роли.
    when: >-
      Когда удобнее работать со всеми скульптами разом: выделить их, скрыть,
      отдать в другую программу.
    result: >-
      В сцене появляется коллекция `Bake Group`, а в ней — `High`, `Low` и
      `Cage` с соответствующими объектами. Опустевшие коллекции от прошлых
      раскладок удаляются, дерево в аутлайнере сворачивается.
    result_shot: r/layout-flat.png

  layout-per-asset:
    label: "Per Asset ( Bake_name )"
    shot: c/layout-per-asset.png
    covers: [qcbake.organize]
    what: >-
      Раскладывает объекты по коллекциям, сгруппировав их по парам — одна
      коллекция на ассет.
    when: >-
      Когда ассетов много и надо видеть, у какого из них пара неполная. Это
      основной режим перед сдачей.
    result: >-
      На каждую пару заводится своя коллекция `Bake_<имя>`. Каждая помечается
      цветом: **зелёная** — есть и low, и high, можно печь; **красная** — чего-то
      не хватает. Неполные пары видно в аутлайнере сразу, не раскрывая
      коллекции.
    result_shot: r/layout-per-asset.png
    note: >-
      Переключаться между Flat и Per Asset можно сколько угодно: каждая кнопка
      строит дерево заново.

  convention:
    label: Convention
    shot: c/convention.png
    covers: [naming_preset]
    what: >-
      Набор суффиксов, которыми помечаются роли.
    default: Substance — `_low`, `_high`, `_cage`.
    when: >-
      Меняйте под тот запекатель, в который пойдёт ассет. Substance и Marmoset
      дают одинаковый результат — это два названия одного набора, оставленные
      для наглядности. xNormal использует короткие `_lo` и `_hi`.
    note: >-
      Выбор влияет не только на переименование. По этим же суффиксам аддон ищет
      объекты для свитка Visibility и для обеих утилит. Смените набор — и старые
      объекты для аддона перестанут существовать.

  custom-suffixes:
    label: Low / High / Cage
    shot: c/custom-suffixes.png
    covers: [custom_low_suffix, custom_high_suffix, custom_cage_suffix]
    what: >-
      Три поля со своими суффиксами. Появляются, только когда в Convention
      выбран Custom.
    when: >-
      Когда в проекте принято своё именование и готовые наборы не подходят.
    note: >-
      Поля Low и High не должны быть пустыми и не должны совпадать между собой —
      иначе Create Namepair откажется работать и скажет об этом. Поле Cage можно
      оставить пустым: тогда клетки в работе аддона не участвуют.

  detect-by:
    label: Detect By
    shot: c/detect-by.png
    covers: [hilo_criterion]
    what: >-
      По какому счётчику аддон решает, кто из двух объектов высокополигональный.
    default: Triangles — треугольники.
    when: >-
      Треугольники надёжнее всего: результат не зависит от того, собран объект из
      четырёхугольников или из n-гонов. Менять на Faces или Vertices стоит
      только если на треугольниках счётчики у объектов совпали.
    note: >-
      Считается итоговая геометрия, с учётом модификаторов. Если счётчики
      совпали, аддон откажется гадать и попросит развести объекты вручную.

  opt-random:
    label: Generate Random Name
    shot: c/opt-random.png
    covers: [generate_random_name]
    what: >-
      Даёт паре случайное имя из шести символов вместо имени низкополигонального
      объекта.
    default: выключено
    when: >-
      Когда исходные имена мусорные — вроде `Cube.023` — и всё равно будут
      переименованы позже по-человечески.

  opt-datablock:
    label: Also Rename Mesh Data
    shot: c/opt-datablock.png
    covers: [also_rename_datablock]
    what: >-
      Переименовывает вместе с объектом и его mesh-данные.
    default: включено
    when: >-
      Держите включённым. Часть пайплайнов при экспорте в FBX опирается на имя
      mesh-данных, а не объекта, и расхождение потом трудно отследить.

  opt-cage:
    label: Detect Cage
    shot: c/opt-cage.png
    covers: [detect_cage]
    what: >-
      Считает клеткой тот из выделенных объектов, чьё имя уже заканчивается на
      суффикс клетки, и исключает его из сравнения high/low.
    default: включено
    when: >-
      Если пользуетесь клетками. Клетку нужно назвать заранее — хотя бы
      `что-угодно_cage`. По геометрии аддон клетку не угадывает.
    result: >-
      Такой объект получает имя `<база>_cage` и в определении ролей не участвует.

  opt-collection:
    label: Move to Collection
    shot: c/opt-collection.png
    covers: [move_to_collection]
    what: >-
      Сразу после переименования складывает пару в отдельную коллекцию
      `Bake_<имя>`.
    default: выключено
    when: >-
      Когда пары делаются по одной и хочется, чтобы сцена раскладывалась сама.
      Если пары делаются пачкой, удобнее разложить всё разом кнопкой Per Asset.
    note: >-
      Объект при этом отвязывается от всех прежних коллекций.

  opt-hide:
    label: Hide After Renaming
    shot: c/opt-hide.png
    covers: [hide_after_renaming]
    what: >-
      Прячет объекты сразу после переименования.
    default: выключено
    when: >-
      Когда пар в сцене много и каждая готовая мешает смотреть на следующую.

  opt-collisions:
    label: Allow Name Collisions
    shot: c/opt-collisions.png
    covers: [overwrite_names]
    what: >-
      Разрешает переименование, даже если нужное имя уже занято другим объектом.
    default: выключено
    when: >-
      Практически никогда. Выключенная галочка — это защита: аддон
      останавливается и говорит, какое имя мешает, чтобы вы разобрались.
    note: >-
      Со включённой галочкой Blender добавит к имени `.001`. Для запекателя
      `barrel_low.001` — это уже другое имя, и пара разваливается. Именно так в
      сценах и заводятся объекты, которые «почему-то не пекутся».
