# Содержание справочника QC Maya Viewport.

title: Что делает каждая кнопка
intro: >-
  Аддон живёт не в N-панели: иконка сферы в шапке 3D-вьюпорта включает режим, а
  стрелка рядом раскрывает меню с настройками.

  Снимки ниже сделаны с содержимым этого меню. Всплывающее меню в снимок окна
  не попадает — оно существует, только пока его держит мышь, — поэтому кадры
  сняты с того же набора кнопок, показанного в боковой панели. Порядок, подписи
  и вид кнопок те же, отличается только рамка вокруг них.

sections:
  - title: Режимы отображения
    intro: >-
      Четыре взаимоисключающих режима. Активный остаётся вдавленным.
    controls:
      [mode-normal-only, mode-normal-ao, mode-ao, mode-default]

  - title: Остальное меню
    controls: [reimport, convention]

controls:
  mode-normal-only:
    label: Normal Only
    shot: c/mode-normal-only.png
    covers: [mvm.set_custom_mode, mvm.apply_custom, mode]
    what: >-
      Показывает только карту нормалей, без освещения.
    when: >-
      Главный режим для приёмки запечённой нормали. Без света видно то, что
      обычно теряется под затенением: швы по границам развёртки, градиенты от
      неверной клетки, artефакты от пересечений высокополигональной модели.
    note: >-
      Если рельеф читается наизнанку — выпуклости выглядят вмятинами — дело не
      в карте, а в соглашении о нормалях. Переключатель внизу меню.

  mode-normal-ao:
    label: Normal + AO
    shot: c/mode-normal-ao.png
    what: >-
      Нормаль вместе с затенением.
    when: >-
      Ближе всего к тому, как модель будет выглядеть в движке. Годится для
      финального взгляда, когда нормаль уже проверена в Normal Only.

  mode-ao:
    label: AO Only
    shot: c/mode-ao.png
    what: >-
      Только затенение, без карт.
    when: >-
      Когда нужно оценить форму и объём, а текстура отвлекает. Хорошо видно
      провалы и места, где высокополигональная модель не пропеклась.

  mode-default:
    label: Default Material
    shot: c/mode-default.png
    what: >-
      Единый серый материал: ни нормали, ни затенения.
    when: >-
      Чистый силуэт и топология. Тот же взгляд, что и на глиняном рендере: если
      форма плоха, никакая карта её не спасёт.

  reimport:
    label: Reimport Textures
    shot: c/reimport.png
    covers: [mvm.reimport_textures]
    what: >-
      Перечитывает текстуры с диска.
    when: >-
      После каждого перезапекания карт во внешней программе. Blender держит
      текстуры в кеше и сам изменения не подхватывает: во вьюпорте останется
      старая картинка, и легко полчаса разглядывать артефакт, которого уже нет.

  convention:
    label: OpenGL / DirectX
    shot: c/convention.png
    covers: [mvm.set_normal_convention, mvm.disable_viewer, convention]
    what: >-
      Направление зелёного канала карты нормалей.
    default: OpenGL
    when: >-
      Ставьте то, что ждёт ваш движок. **OpenGL** — Y вверх: Blender, Marmoset,
      Unreal. **DirectX** — Y вниз: Unity по умолчанию и часть внутренних
      движков.
    note: >-
      Переключатель меняет только показ в Blender. Если карта запечена в одном
      соглашении, а движок ждёт другое, править надо запекание, а не эту кнопку.
      Здесь она нужна, чтобы смотреть карту так же, как её увидит движок.
