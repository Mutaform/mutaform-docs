# Содержание справочника QC Maya Viewport.

title: Что делает каждая кнопка
intro: >-
  Аддон живёт не в N-панели: иконка сферы в шапке 3D-вьюпорта включает режим, а
  стрелка рядом раскрывает меню с настройками.

  Снимки ниже сделаны с содержимым этого меню. Всплывающее меню в снимок окна
  не попадает — оно существует, только пока его держит мышь, — поэтому кадры
  сняты с того же набора кнопок, показанного в боковой панели. Порядок, подписи
  и вид кнопок те же, отличается только рамка вокруг них.

sections:
  - title: Режимы отображения
    intro: >-
      Пять взаимоисключающих режимов. Активный остаётся вдавленным.
    controls:
      [mode-normal-only, mode-normal-ao, mode-ao, mode-roughness, mode-default]

  - title: Текстуры
    intro: >-
      Аддон умеет не только показывать карты, но и подключать их. Обе кнопки
      идут в меню сразу под режимами.
    controls: [find-textures, reimport]

  - title: Остальное меню
    controls: [convention, settings]

controls:
  mode-normal-only:
    label: Normal Only
    shot: c/mode-normal-only.png
    covers: [mvm.set_custom_mode, mvm.apply_custom, mode]
    what: >-
      Показывает только карту нормалей, без освещения.
    when: >-
      Главный режим для приёмки запечённой нормали. Без света видно то, что
      обычно теряется под затенением: швы по границам развёртки, градиенты от
      неверной клетки, artефакты от пересечений высокополигональной модели.
    note: >-
      Если рельеф читается наизнанку — выпуклости выглядят вмятинами — дело не
      в карте, а в соглашении о нормалях. Переключатель внизу меню.

  mode-normal-ao:
    label: Normal + AO
    shot: c/mode-normal-ao.png
    what: >-
      Нормаль вместе с затенением.
    when: >-
      Ближе всего к тому, как модель будет выглядеть в движке. Годится для
      финального взгляда, когда нормаль уже проверена в Normal Only.

  mode-ao:
    label: AO Only
    shot: c/mode-ao.png
    what: >-
      Только затенение, без карт.
    when: >-
      Когда нужно оценить форму и объём, а текстура отвлекает. Хорошо видно
      провалы и места, где высокополигональная модель не пропеклась.

  mode-roughness:
    label: Roughness Only
    shot: c/mode-roughness.png
    what: >-
      Показывает карту шероховатости плоской заливкой — без света, нормали и
      цвета.
    when: >-
      Когда на модели неожиданный блик или, наоборот, мёртвая матовая область, и
      надо понять, откуда она. На обычном шейдинге шероховатость смешана со
      светом и формой, и разглядеть её отдельно не выходит.
    result: >-
      Нужный канал аддон достаёт сам: из упакованной `_ORM`, `_MRO` или `_spec`
      берёт её канал шероховатости, из `_NRM` — синий. Материал, в котором
      шероховатости нет вовсе, читается средним серым, а не белым: так видно
      разницу между «шероховатость 1.0» и «карты нет».

  mode-default:
    label: Default Material
    shot: c/mode-default.png
    what: >-
      Единый серый материал: ни нормали, ни затенения.
    when: >-
      Чистый силуэт и топология. Тот же взгляд, что и на глиняном рендере: если
      форма плоха, никакая карта её не спасёт.

  find-textures:
    label: Find Textures
    shot: c/find-textures.png
    covers: [mvm.load_textures, directory, filename, recursive, match_names,
             all_slots, set_convention]
    what: >-
      Подбирает текстуры из папки и подключает их в Principled BSDF, разбирая
      суффиксы в именах файлов.
    when: >-
      Когда приехал ассет с набором карт и надо увидеть его собранным, не
      расставляя ноды руками. Выделите объект, выберите слот материала и
      нажмите — откроется браузер файлов.
    result: >-
      Браузер открывается сразу на папке этого ассета, а не где придётся.
      Blender путь импорта не хранит, поэтому аддон решает задачу с двух
      сторон: всё, что импортируется с этого момента, он помечает путём сам, а
      уже лежащее в сцене ищет по имени под папками **Project Roots** из
      Settings. Если ассет нашёлся во вложенной `Meshes`, аддон поднимается на
      уровень выше — туда, где реально лежат карты.

      Дальше карты расходятся по назначению: данные получают Non-Color, нормаль
      идёт через Normal Map, высота через Bump, упакованные `_ORM`-подобные
      разбираются по каналам. Уже подключённые текстуры перенаправляются, а не
      дублируются, так что повторный запуск ничего не размножит.
    note: >-
      Рядом с самой кнопкой в меню стоит галочка **All Selected Objects** — за
      один заход заполнить все материалы на всех выделенных объектах, а не
      только активный слот. Она включена по умолчанию и запоминается: набор,
      приехавший двумя десятками односоставных мешей, собирается одним
      нажатием. Та же галочка продублирована в браузере.

      В браузере справа ещё три. **Search Subfolders** — смотреть и во вложенные
      папки. **Match Material Name** — брать только файлы, похожие по имени на
      материал; снимите, если в папке один набор, а имена не совпадают.
      **Normal Convention From Name** — переключить соглашение, если оно
      написано в имени файла.

      Служебные карты не подключаются намеренно: `_cc` (маска тонирования),
      `_curve`, `_cavity`, `_thickness`, `_objid`, `_matid`, `_position`, `_id`
      и нормали, запечённые в объектном пространстве. Полноразмерный файл
      выигрывает у своей копии из вложенной папки вроде `1k`.

  reimport:
    label: Reimport Textures
    shot: c/reimport.png
    covers: [mvm.reimport_textures]
    what: >-
      Перечитывает текстуры с диска.
    when: >-
      После каждого перезапекания карт во внешней программе. Blender держит
      текстуры в кеше и сам изменения не подхватывает: во вьюпорте останется
      старая картинка, и легко полчаса разглядывать артефакт, которого уже нет.

  convention:
    label: OpenGL / DirectX
    shot: c/convention.png
    covers: [mvm.set_normal_convention, mvm.disable_viewer, convention]
    what: >-
      Направление зелёного канала карты нормалей.
    default: OpenGL
    when: >-
      Ставьте то, что ждёт ваш движок. **OpenGL** — Y вверх: Blender, Marmoset,
      Unreal. **DirectX** — Y вниз: Unity по умолчанию и часть внутренних
      движков. Если рельеф читается наизнанку — выпуклости выглядят вмятинами, —
      начинать надо отсюда.
    result: >-
      Переключаются не только диагностические режимы, но и все ноды Normal Map в
      материалах сцены, включая лежащие внутри групп. Поэтому обычный рендер в
      EEVEE и Cycles показывает то же самое, а не расходится с QC-режимом.
      Правка обычная, отменяется через ++ctrl+z++.

      При включении режима аддон, наоборот, считывает соглашение с нод сцены,
      чтобы не начинать с расхождения между ними и вьюпортом.
    note: >-
      Это способ смотреть карту так, как её увидит движок, а не способ починить
      неверно запечённую. Если карта запечена в одном соглашении, а движок ждёт
      другое, править надо запекание.

  settings:
    label: Settings
    shot: c/settings.png
    covers: [mvm.suffix_settings]
    what: >-
      Открывает таблицу суффиксов: какой хвост в имени файла считать какой
      картой.
    when: >-
      Когда в проекте своё именование и Find Textures узнаёт не все карты.
      Строку можно поправить, добавить свою или удалить — удалённое правило
      перестаёт срабатывать по-настоящему.
    result: >-
      В таблице 104 встроенных правила и кнопка сброса к ним. Живёт она в
      настройках Blender, а не в файле сцены: переживает перезапуск и действует
      во всех сценах на этой машине. Здесь же задаются **Project Roots** —
      папки, под которыми Find Textures ищет ассет по имени.

      Отдельным блоком идёт **Maya Match** — калибровка серого под Maya.
      **Maya Tone Curve** воспроизводит тоновую кривую вьюпорта Maya (по
      умолчанию включена, она рассчитана на ACES 1.0 SDR-video); **Diffuse
      Level** и **Specular Level** — замеренные уровни рассеянного света и
      блика. Трогать их нужно, только если ваша Maya настроена на обычный sRGB
      вместо ACES.
    note: >-
      Диалог сам пишет, сохраняется таблица или нет. Если автосохранение
      настроек выключено, там же появится кнопка **Save Preferences** — без неё
      правка пропадёт при выходе из Blender.
