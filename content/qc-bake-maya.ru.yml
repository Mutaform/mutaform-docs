# Содержание справочника QC Bake for Maya.
#
# Аддон не для Blender, поэтому генератор не разбирает его код и не сверяет
# полноту описания: панель собрана императивным кодом Qt, достоверного списка
# элементов из исходника не построить. Следить за тем, чтобы новая кнопка
# попала сюда, приходится руками.

title: Что делает каждая кнопка
intro: >-
  Панель открывается кнопкой **QC Bake** на полке *Mutaform*. Она докируемая:
  можно оставить плавающей, а можно пристыковать к боковой панели Maya.

  Порядок разделов здесь тот же, что в панели сверху вниз.

sections:
  - title: Главные кнопки
    intro: >-
      Две кнопки и строка под ними, которая заранее говорит, что произойдёт.
    controls: [create-namepair, swap, selection-hint]

  - title: Visibility — показать и скрыть
    intro: >-
      Показывает и прячет объекты по ролям, по всей сцене сразу. Работает через
      display layers Maya.
    controls: [visibility-row, visibility-all, clear-layers]

  - title: Utilities — работа со сценой целиком
    intro: >-
      Объединение далеко разнесённых пар в общие группы запекания и раскладка
      аутлайнера.
    controls: [prefix, minimum-gap, reduce, flat, per-asset]

  - title: Naming — какими суффиксами помечать
    controls: [convention, detect-by, count-smooth]

  - title: Options — поведение при переименовании
    controls:
      [generate-random, rename-shape, detect-cage, move-to-group,
       hide-after, allow-collisions, track-order]

  - title: Updates — обновления
    intro: >-
      В Maya нет репозитория аддонов, поэтому проверка обновлений встроена в
      сам инструмент.
    controls: [check-on-open, check-now, status]

controls:
  create-namepair:
    label: Create Namepair
    shot: c/create-namepair.png
    what: >-
      Переименовывает выделенные меши в пару: `<имя>_low` и `<имя>_high`.
    when: >-
      Основное действие. Выделите меши ассета и нажмите — порядок выделения не
      важен, роли аддон определит сам.
    result: >-
      При двух мешах плотный становится хаем. При трёх и больше низкополигональным
      будет один, остальные получат нумерацию: `asset_high_01`, `asset_high_02`.
      Какой именно окажется лоу, зависит от **Track Selection Order**: с ним —
      выделенный последним, без него — самый лёгкий меш.

      Имя берётся от лоу, старый суффикс из него вырезается. Неймспейсы
      сохраняются: объект из `chair:parts` останется в нём же.
    disabled: >-
      Выделено меньше двух мешей. Считаются только меши: кривые, локаторы и
      камеры в счёт не идут.
    note: >-
      Переименование — единственное, что делает кнопка. Геометрию она не трогает
      никогда.

  swap:
    label: Swap High / Low
    shot: c/swap.png
    what: >-
      Меняет роли пары местами.
    when: >-
      Когда автоматика ошиблась. Так бывает с плотным лоу против грубого
      блокаута: по треугольникам лоу оказывается тяжелее, хотя по смыслу он лоу.
    result: >-
      Быстрее, чем переименовывать руками: имена меняются местами вместе с
      суффиксами.
    disabled: >-
      В выделении нет готовой пары: не нашлось объекта с суффиксом low и объекта
      с суффиксом high.

  selection-hint:
    label: Строка под кнопками
    shot: c/selection-hint.png
    what: >-
      Говорит, что произойдёт при нажатии, ещё до нажатия.
    when: >-
      Читать её стоит всегда: она заранее показывает, кого аддон считает хаем.
      Если написанное расходится с задуманным, поможет **Swap High / Low** или
      галка **Track Selection Order**.
    result: >-
      Без выделения — «Nothing selected». С двумя мешами — сколько выделено и
      что плотный станет хаем.

  visibility-row:
    label: Строка роли (High, Low, Cage)
    shot: c/visibility-row.png
    what: >-
      Показывает и прячет все объекты роли по всей сцене, независимо от
      выделения.
    when: >-
      Чтобы посмотреть на лоу без нависающего хая — и обратно.
    result: >-
      Нажатая кнопка подсвечивается. Роль, которой в сцене нет, недоступна:
      кейдж в пустой сцене так и останется серым.
    disabled: >-
      В сцене нет объектов с таким суффиксом. Сразу после Create Namepair строки
      High и Low оживают, а Cage — только если кейдж действительно есть.
    note: >-
      Сделано на display layers, и это важнее, чем кажется: аддон **не затирает
      видимость, выставленную вами руками**. Включение роли возвращает то, что
      было, а не то, что решил инструмент.

  visibility-all:
    label: Строка All
    shot: c/visibility-all.png
    what: >-
      То же самое, но сразу для всех ролей.
    when: >-
      Быстро вернуть сцену в исходный вид после того, как половина спрятана.

  clear-layers:
    label: Clear QC Bake Layers
    shot: c/clear-layers.png
    what: >-
      Убирает слои, которые аддон завёл для переключения видимости.
    when: >-
      Перед отдачей сцены, чтобы не тащить служебные слои дальше. На сами
      объекты и их имена это не влияет — только на слои.

  prefix:
    label: Prefix
    shot: c/prefix.png
    what: >-
      Начало имени, которое получат объединённые группы запекания.
    default: BakeGroup
    when: >-
      Меняйте, если в проекте свои правила именования. Из него собираются имена
      вида `BakeGroup_01_low`.

  minimum-gap:
    label: Minimum Gap
    shot: c/minimum-gap.png
    what: >-
      Наименьшее расстояние между габаритными коробками, при котором две пары
      разрешено объединять в одну группу.
    default: "0,050"
    when: >-
      Чем больше значение, тем осторожнее объединение и тем больше групп
      останется.
    note: >-
      Смысл в том, что лучи с одного ассета не должны попасть в хай другого.
      Стоящие вплотную пары объединять нельзя — запечётся чужая геометрия.

  reduce:
    label: Reduce Bake Groups
    shot: c/reduce.png
    what: >-
      Объединяет разнесённые в пространстве пары в меньшее число групп
      запекания. Стрелка справа — возврат к прежним именам.
    when: >-
      Когда в сцене десяток мелких ассетов и печь каждый отдельным проходом
      расточительно. Разнесённые достаточно далеко не проецируются друг в друга,
      значит могут делить один проход.
    result: >-
      Объекты получают общее имя группы: `BakeGroup_01_low`, `BakeGroup_01_high_01`
      и так далее. Неполные пары пропускаются, сколько их было — аддон сообщает.
    note: >-
      Каждое переименование записывается в сцену, поэтому **Restore работает и
      завтра**, когда стек отмены Maya давно пуст. Откатывается последний прогон;
      запустите Reduce дважды — первый набор имён потеряется.

  flat:
    label: Flat ( High / Low )
    shot: c/flat.png
    what: >-
      Раскладывает аутлайнер по ролям: группы `High`, `Low`, `Cage` под общей
      `Bake_Group`.
    when: >-
      Когда удобнее видеть всё низкополигональное вместе.
    note: >-
      Участники определяются **только по суффиксу имени**, поэтому пропы и
      вспомогательные меши не затрагиваются. Геометрия при группировке не
      сдвигается.

  per-asset:
    label: Per Asset ( Bake_name )
    shot: c/per-asset.png
    what: >-
      Раскладывает аутлайнер по парам: каждый ассет получает группу `Bake_<имя>`.
    when: >-
      Когда ассетов много и важно видеть, у какого пара неполная.
    result: >-
      Группа помечается цветом: зелёная — пара полная, можно печь; красная —
      участника не хватает или внутри лежит посторонний объект. Видно в
      аутлайнере сразу, без раскрытия.

  convention:
    label: Convention
    shot: c/convention.png
    what: >-
      Набор суффиксов, которыми помечаются роли.
    default: Substance ( _low / _high )
    when: >-
      Ставьте тот, что ждёт ваш запекатель. Выбор влияет не только на
      переименование: по этим же суффиксам аддон ищет объекты для Visibility и
      для обеих утилит, так что после смены пресета прежние объекты для него
      перестают существовать.

  detect-by:
    label: Detect By
    shot: c/detect-by.png
    what: >-
      Признак, по которому сравнивается плотность сеток.
    default: Triangles
    when: >-
      Меняйте, если по треугольникам роли определяются неверно. Есть ещё
      полигоны и вершины.

  count-smooth:
    label: Count Smooth Preview
    shot: c/count-smooth.png
    what: >-
      Считать ли сглаженную сетку вместо базовой.
    default: выключено
    when: >-
      Включите, если работаете с включённым smooth preview — клавишей «3».
    note: >-
      Этого пункта нет в версии для Blender, он понадобился из-за Maya:
      `polyEvaluate` не видит smooth mesh preview. Без галки хай, который вы
      смотрите сглаженным, считается по базовой сетке — и легко оказывается
      «легче» лоу.

  generate-random:
    label: Generate Random Name
    shot: c/generate-random.png
    what: >-
      Даёт паре случайное имя вместо имени исходного объекта.
    default: выключено
    when: >-
      Когда исходные имена — мусор вроде `pCube12` и придумывать своё некогда.

  rename-shape:
    label: Also Rename Shape Node
    shot: c/rename-shape.png
    what: >-
      Переименовывает вместе с трансформом и его shape-ноду.
    default: включено
    when: >-
      Оставьте включённым. Иначе в сцене остаются `barrel_low` с shape
      `pCubeShape1` внутри, и в экспортированном FBX это видно.

  detect-cage:
    label: Detect Cage
    shot: c/detect-cage.png
    what: >-
      Исключает из сравнения объект, чьё имя уже заканчивается на суффикс кейджа.
    default: включено
    when: >-
      Кейдж нужно назвать заранее — хотя бы `что-угодно_cage`. Угадывать кейдж
      по геометрии аддон не пытается.

  move-to-group:
    label: Move to Group
    shot: c/move-to-group.png
    what: >-
      Сразу после переименования складывает пару в группу.
    default: выключено

  hide-after:
    label: Hide After Renaming
    shot: c/hide-after.png
    what: >-
      Прячет хай сразу после того, как пара создана.
    default: выключено
    when: >-
      Удобно, когда хай нужен только для запекания и мешает смотреть на лоу.

  allow-collisions:
    label: Allow Name Collisions
    shot: c/allow-collisions.png
    what: >-
      Разрешает переименование, когда нужное имя уже занято.
    default: выключено
    note: >-
      Именно так в сцене заводятся `barrel_low1`. Для запекателя это уже другое
      имя, и пара разваливается. Включать стоит, только когда точно понятно,
      почему имя занято.

  track-order:
    label: Track Selection Order
    shot: c/track-order.png
    what: >-
      Учитывать порядок выделения: последний выделенный считается
      низкополигональным.
    default: выключено
    when: >-
      Включите, когда роли надо задавать самому, а не отдавать на откуп счётчику
      треугольников.
    note: >-
      Ещё одно отличие от Blender: там есть активный объект, у Maya его нет.
      Галка включает у Maya отслеживание порядка выделения, и до этого момента
      порядок попросту не запоминается.

  check-on-open:
    label: Check on Open
    shot: c/check-on-open.png
    what: >-
      Проверять наличие новой версии при каждом открытии панели.
    default: включено
    result: >-
      Проверка идёт в фоновом потоке и молчит, если не удалась. Когда версия
      новее найдена, сверху панели появляется полоса с кнопкой **Install**.
      Сама она ничего не ставит.

  check-now:
    label: Check for Updates Now
    shot: c/check-now.png
    what: >-
      Проверить обновления немедленно.
    when: >-
      Когда автопроверка выключена или хочется убедиться прямо сейчас. В отличие
      от фоновой, эта проверка сообщает и об неудаче.
    note: >-
      По кнопке **Install** архив скачивается, сверяется с контрольной суммой,
      распаковывается и подменяет папку — **без перезапуска Maya**. Прежняя
      версия хранится, пока новая не загрузится, поэтому сломанный релиз
      откатывает себя сам.

  status:
    label: Строка состояния
    shot: c/status.png
    what: >-
      Итог последнего действия внизу панели.
    when: >-
      Сюда стоит смотреть первым делом, если кажется, что ничего не произошло:
      здесь и «Namepair 'barrel' created: 1 low, 1 high», и причина отказа.
