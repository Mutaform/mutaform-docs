# Содержание справочника QC Smart Cylinder.

title: Что делает каждая кнопка
intro: >-
  У аддона нет своей панели: он добавляет один пункт в меню `Add > Mesh`, а все
  настройки живут в панели **Adjust Last Operation** — той, что раскрывается в
  левом нижнем углу вьюпорта после действия или по ++f9++.

  Панель показывает разный набор настроек в зависимости от того, что аддон
  делает: строит новый цилиндр или перестраивает выделенный. Ниже разобраны оба
  набора и таблица правила из настроек аддона.

sections:
  - title: Где он лежит
    intro: >-
      Один пункт, сразу под встроенным Cylinder.
    controls: [menu-item]

  - title: New Cylinder — новый цилиндр
    intro: >-
      Настройки в панели Adjust Last Operation, когда выбран режим
      **New Cylinder**. Диаметр меняется — число сечений пересчитывается тут же.
    controls: [mode, diameter, depth, readout, cap-fill, uvs, transform]

  - title: Fix Selected — перестройка выделенного
    intro: >-
      Тот же оператор, но вместо нового цилиндра он перестраивает уже
      существующие формы. Аддон сам переключается в этот режим, если при вызове
      что-то выделено.
    controls: [count-mode, section-step, diameter-source, manual, report]

  - title: Настройки аддона
    intro: >-
      `Edit → Preferences… → Add-ons → QC Smart Cylinder`. Здесь лежит само
      правило: по какой таблице считается число сечений.
    controls: [prefs-anchors, prefs-limits, prefs-preview]

controls:
  menu-item:
    label: Add → Mesh → qc Smart Cylinder
    shot: c/menu-item.png
    covers: [mesh.qc_smart_cylinder_add, mode]
    what: >-
      Единственная точка входа. Пункт стоит **строго под встроенным Cylinder**,
      чтобы рука шла туда же, куда и раньше.
    when: >-
      Что произойдёт по нажатию, зависит от выделения. Ничего не выделено —
      появится новый цилиндр в 3D-курсоре. Выделен меш с цилиндрической формой —
      аддон перестроит его. Режим потом можно переключить в панели
      Adjust Last Operation.
    note: >-
      Если выделено что-то, в чём цилиндрической формы нет, аддон **не** создаст
      неожиданный цилиндр рядом, а напишет причину в отчёте.

  mode:
    label: Mode
    shot: c/mode.png
    covers: [mode]
    what: >-
      Переключатель между **New Cylinder** и **Fix Selected**.
    default: выбирается сам по выделению в момент вызова
    when: >-
      Когда аддон угадал не то. Например, выделен цилиндр, но нужен не ремонт
      старого, а новый рядом: переключите на New Cylinder прямо в панели, не
      снимая выделения.

  diameter:
    label: Diameter
    shot: c/diameter.png
    covers: [diameter]
    what: >-
      Диаметр цилиндра — не радиус. Из него и считается число сечений.
    default: "`0.4 m`, то есть 40 см — по таблице 36 сечений."
    when: >-
      Главное поле режима New. Вводить можно в любых единицах: наберите `40 cm`,
      и Blender переведёт сам. Масштаб сцены (`Scene → Units → Unit Scale`)
      аддон учитывает — правило считает по настоящим сантиметрам, а не по
      условным единицам.

  depth:
    label: Depth
    shot: c/depth.png
    covers: [depth]
    what: >-
      Высота цилиндра.
    default: "`1 m`"
    when: >-
      На число сечений не влияет никак: правило смотрит только на диаметр.

  readout:
    label: Segments и Edge Length
    shot: c/readout.png
    covers: [segments, edge_length]
    what: >-
      Два поля, которые нельзя редактировать: сколько сечений выдало правило и
      какой длины получилось ребро.
    when: >-
      Это способ увидеть, что правило вообще делает. Потяните диаметр — число
      сечений пойдёт ступенями, а длина ребра останется примерно на месте. Ради
      этого таблица и заведена: ребро одной длины на мешах любого размера.
    note: >-
      Длина ребра — настоящая хорда между соседними вершинами, а не длина дуги.

  cap-fill:
    label: Cap Fill Type
    shot: c/cap-fill.png
    covers: [end_fill_type]
    what: >-
      Чем закрыты торцы: **N-Gon**, **Triangle Fan** или ничем.
    default: N-Gon
    when: >-
      То же самое, что у встроенного Cylinder, и означает то же самое. N-Gon —
      обычный выбор для лоуполи: одна грань, которую легко выделить и подрезать.

  uvs:
    label: Generate UVs
    shot: c/uvs.png
    covers: [calc_uvs]
    what: >-
      Сразу сделать простую развёртку.
    default: включено
    when: >-
      Оставляйте включённым: развёртка всё равно понадобится, а пустой меш без
      UV-слоя потом легко проскочить мимо запекания.

  transform:
    label: Align, Location, Rotation
    shot: c/transform.png
    covers: [align, location, rotation]
    what: >-
      Где и как встанет новый цилиндр.
    default: "`Align: World`, положение — 3D-курсор."
    when: >-
      Стандартный блок Blender, одинаковый у всех примитивов. **Align: View**
      ставит цилиндр лицом к камере, **3D Cursor** — по повороту курсора.

  count-mode:
    label: Segments — Per Section или Whole Form
    shot: c/count-mode.png
    covers: [count_mode]
    what: >-
      Считать число сечений отдельно для каждой секции формы или одно на всю
      форму целиком.
    default: Per Section
    when: >-
      **Per Section** — для деталей переменного диаметра: токарных, труб с
      переходами, стержней с утолщениями. Широкая часть получит больше сечений,
      узкая — меньше, между ними аддон построит треугольные мосты.

      **Whole Form** — когда деталь должна остаться одним ровным цилиндром без
      переходов. Число берётся с одного кольца, выбранного ниже.

  section-step:
    label: Section Step
    shot: c/section-step.png
    covers: [section_step]
    what: >-
      Насколько должен измениться диаметр между соседними кольцами, чтобы аддон
      счёл это началом новой секции.
    default: "25 %"
    when: >-
      Появляется только в режиме Per Section. Секций получилось слишком много —
      поднимите значение, деталь разбилась грубее, чем надо — опустите.
    note: >-
      Плоская ступенька между двумя радиусами начинает новую секцию всегда,
      независимо от этого числа.

  diameter-source:
    label: Diameter From
    shot: c/diameter-source.png
    covers: [diameter_source]
    what: >-
      Какое кольцо задаёт диаметр секции, когда кольца в ней разного размера:
      **Largest Ring**, **Average Ring** или **Smallest Ring**.
    default: Largest Ring
    when: >-
      По умолчанию решает самое широкое кольцо — так силуэт в самом заметном
      месте останется гладким. Average пригодится на длинных конусах, где
      верхнее кольцо намного уже нижнего и «по самому широкому» выходит
      избыточно.

  manual:
    label: Manual Segments
    shot: c/manual.png
    covers: [use_manual_segments, manual_segments]
    what: >-
      Отменить правило и перестроить с тем числом, которое введено руками.
    default: выключено
    when: >-
      Для случаев, где правило не при чём: соседняя деталь уже собрана на 24
      сечениях, и новую надо подогнать под неё. Или форма, которую аддон
      пропустил как неоднозначную, — число можно назначить силой.
    note: >-
      Поле числа серое, пока галочка снята: это не сломано, так видно, что
      значение сейчас ни на что не влияет.

  report:
    label: Отчёт
    shot: c/report.png
    covers: [fix_report]
    what: >-
      Построчно: что аддон нашёл и что с этим сделал. По строке на форму.
    when: >-
      Читать всегда, а не только когда что-то пошло не так. `40 cm, 36 → 82` —
      диаметр, было и стало; `already right` — форма и так правильная, её не
      трогали; `no cylindrical form` — аддон ничего не узнал и **ничего не
      испортил**; `capped: check the object scale` — число упёрлось в потолок
      из настроек, и это почти всегда неверный масштаб объекта, а не
      исполинская деталь.
    note: >-
      Строк показывается не больше двенадцати, остальные сворачиваются в
      «… and N more». Не узнаны бывают формы, приваренные к остальной
      геометрии, меши с shape keys и замкнутые кольца секций — это известные
      границы, а не поломка.

  prefs-anchors:
    label: Таблица опорных точек
    shot: c/prefs-anchors.png
    what: >-
      Само правило: при каком диаметре сколько сечений. Строки — опорные точки,
      а не диапазоны.
    default: >-
      студийная таблица: 10 см → 20, 20 → 28, 40 → 36, 60 → 40, 80 → 48,
      100 → 68.
    when: >-
      Между точками число интерполируется, поэтому ступеней получается больше,
      чем строк: 15 см → 24, 30 → 32, 50 → 38. За краями таблицы держится длина
      ребра крайней точки — ниже 10 см число падает пропорционально диаметру,
      выше 100 см так же растёт.
    result: >-
      Кнопки справа: **+** добавляет точку на 10 см выше самой большой, **–**
      удаляет выбранную, круговая стрелка возвращает студийную таблицу.

      Правка действует сразу и на новые цилиндры, и на перестройку — правило
      читается при каждом вызове.
    note: >-
      Таблица живёт в настройках Blender, а не в файле сцены: она общая для всех
      сцен на этой машине и переживает перезапуск. Если правите таблицу под
      конкретный проект, помните, что соседний проект на той же машине увидит те
      же значения.

  prefs-limits:
    label: Minimum, Maximum Segments и Even Counts Only
    shot: c/prefs-limits.png
    what: >-
      Границы числа сечений снизу и сверху и округление до чётного.
    default: "минимум 6, максимум 256, чётность включена"
    when: >-
      Минимум держит совсем мелкие детали от вырождения: без него правило на
      диаметре 2 см выдало бы четырёхгранник. Чётность нужна, чтобы цилиндр
      остался симметричным по обеим осям — так его проще резать пополам и
      зеркалить.
    result: >-
      Максимум — страховка от неверного масштаба. Ассет, у которого сантиметры
      прочитаны как метры, даёт кнопку «диаметром» в двадцать метров, и правило
      честно насчитывает ей больше тысячи сечений на кольцо. Теперь такая форма
      упирается в потолок, а в отчёте появляется `capped: check the object
      scale`.
    note: >-
      На **Manual Segments** потолок не действует: если число назначено руками,
      значит его и хотели.

  prefs-preview:
    label: Preview
    shot: c/prefs-preview.png
    what: >-
      Что правило выдаёт на восьми характерных диаметрах.
    when: >-
      Проверять правку, не выходя из настроек: поправили точку — строчка
      пересчиталась. Быстрее, чем строить пробные цилиндры.
