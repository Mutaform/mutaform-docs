# English content for the QC Bridge Maya-Blender reference.

title: What every button does
intro: >-
  A walk through the bridge panel. Every transfer goes through a single file in
  a shared folder: one side writes, the other reads. When something does not
  work, the report line at the top of the panel is the first place to look.

sections:
  - title: Transferring
    intro: >-
      The three buttons the bridge exists for. They use the exchange folder set
      at the bottom of the panel.
    controls: [report, import, export]

  - title: Convert Scene — hierarchy
    intro: >-
      Collapsed by default. Needed because Maya builds hierarchy out of
      transform nodes and Blender out of collections, and FBX does not translate
      one into the other by itself.
    controls: [convert-toggle, creases, convert-blender, convert-maya]

  - title: Settings — the exchange folder
    intro: >-
      Also collapsed. Set once and then left alone.
    controls: [settings-toggle, exchange]

controls:
  report:
    label: The report line
    shot: c/report.png
    covers: [last_report]
    what: >-
      Reports how the last operation ended.
    default: "`Ready.` — nothing has been done yet."
    when: >-
      Look here first when it seems nothing happened. Error messages land here
      too: file not found, nothing to export, no access to the folder.

  import:
    label: Import From Maya
    shot: c/import.png
    covers: [mutaform_bridge.receive_from_maya, clear_scene]
    what: >-
      Loads the file written out from Maya into the current scene.
    when: >-
      After the bridge's shelf button has been pressed in Maya. The order is
      always the same: Maya writes, Blender reads.
    result: >-
      Objects are added to whatever is already in the scene. Scale and axes are
      converted: Maya works in centimetres, Blender in metres.
    note: >-
      If a whole scene arrives from Maya and stacking it on top of the current
      one is not what you want, clear the scene beforehand — the import never
      deletes anything itself.

  export:
    label: Export Selected and Export Selected Collection
    shot: c/export.png
    covers: [mutaform_bridge.send_scene_to_maya,
             mutaform_bridge.send_selection_to_maya]
    what: >-
      Two export buttons. The left one sends the selected objects, the right one
      sends the selected collection whole, structure included.
    when: >-
      The right one matters when hierarchy does: the collection arrives in Maya
      as a group. The left one is for quickly throwing a couple of objects over.
    result: >-
      An FBX appears in the exchange folder. Maya picks it up with the shelf
      button.
    note: >-
      It is always the same file with the name from the settings. Every export
      overwrites the previous one — if a colleague has not collected theirs yet,
      it is gone.

  convert-toggle:
    label: Convert Scene
    shot: c/convert-toggle.png
    covers: [show_advanced]
    what: >-
      Opens the hierarchy conversion block.
    default: collapsed
    when: >-
      Worth opening right after importing from Maya: the groups that arrive look
      like empties, and they are awkward to work with in Blender.

  creases:
    label: Export Creases
    shot: c/creases.png
    covers: [export_creases]
    what: >-
      Whether edge and vertex creases are sent to Maya.
    default: "off"
    when: >-
      Turn it on only when creases are genuinely wanted on the other side — for
      instance when the model goes under a subdiv in Maya. It is off by default
      because creases usually just get in the way, arriving in Maya as extra
      attributes.

  convert-blender:
    label: Convert In Blender Style
    shot: c/convert-blender.png
    covers: [mutaform_bridge.convert_from_maya, unpack_scope, unpack_bake, scope,
             bake_transforms]
    what: >-
      Turns a hierarchy of empties from Maya into proper Blender collections.
    when: >-
      Straight after Import From Maya. **Convert Scope** decides what is
      processed: the whole scene, or only the selected empties.
    result: >-
      The empties disappear, replaced by collections with the same structure.
    note: >-
      **Bake Transforms** is on by default and should stay that way: it applies
      the transforms accumulated on the empties so the meshes stay where they
      are. Without it objects scatter, because a group's transform vanishes
      along with the group.

  convert-maya:
    label: Convert In Maya Style
    shot: c/convert-maya.png
    covers: [mutaform_bridge.convert_to_maya, pack_scope]
    what: >-
      The reverse: Blender collections become empties that Maya reads as groups.
    when: >-
      Before exporting, when the other side needs hierarchy. **Send Scope**
      picks the whole scene or the active collection.

  settings-toggle:
    label: Settings
    shot: c/settings-toggle.png
    covers: [show_settings]
    what: >-
      Opens the exchange folder settings.
    default: collapsed

  exchange:
    label: Exchange Folder and FBX Name
    shot: c/exchange.png
    covers: [exchange_dir, exchange_name]
    what: >-
      The folder transfers go through, and the name of the file in it.
    default: "`Documents\\MutaformBridge` and `mutaform_bridge.fbx`."
    when: >-
      Set once. The single requirement: Blender and Maya must point at **the
      same folder**. If a transfer does nothing, check that before anything
      else.
    note: >-
      The `.fbx` extension is appended automatically if you leave it out. An
      empty name falls back to the default.
